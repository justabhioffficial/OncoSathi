# Render Blueprint Configuration for OncoSathi AI Backend
services:
  - type: web
    name: oncosathi-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_api.py"
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: 3.11.9
